telegram:
  bot_token: "YOUR_BOT_TOKEN_FROM_BOTFATHER"
  owner_user_id: 123456789      # your numeric Telegram ID (get from @userinfobot)

# Remove the entire block for any platform you don't want
whatsapp:
  access_token: "YOUR_META_ACCESS_TOKEN"
  phone_number_id: "YOUR_PHONE_NUMBER_ID"
  verify_token: "YOUR_CUSTOM_VERIFY_TOKEN"  # any string you choose
  app_secret: "YOUR_APP_SECRET"             # optional, for signature verification

discord:
  bot_token: "YOUR_DISCORD_BOT_TOKEN"
  owner_id: 123456789           # your Discord user ID (optional)

slack:
  bot_token: "xoxb-..."          # Bot User OAuth Token (the main ZERO app)
  app_token: "xapp-..."          # App-Level Token (Socket Mode) -- set this to use Socket Mode
  signing_secret: ""             # only for the legacy HTTP webhook mode

# Extra Slack identities -- specialist bots, each its own Slack app, ALL backed
# by the one ZERO brain (shared memory + context). Only the persona differs.
slack_agents:
  - name: "Dev"
    bot_token: "xoxb-..."        # Dev app's bot token
    app_token: "xapp-..."        # Dev app's app-level token (Socket Mode)
    system: >
      You are Dev, the web-development specialist on the owner's AI team,
      answering in Slack. You ship frontend, backend, API and deploy work. For
      any coding or design task, use your code tools (Codex or Claude Code) in
      the correct repo under /opt/jarvis or /var/www, then summarize what you
      changed and link the PR if you opened one. Be concise and technical. If a
      request is not about code, say so and suggest the owner ask ZERO.
  # - name: "CFO"
  #   bot_token: "xoxb-..."
  #   app_token: "xapp-..."
  #   system: "You are CFO, the finance specialist. Answer money questions from the CRM and Stripe."

# Google Calendar (supports multiple accounts)
# Same credentials file as Gmail -- one OAuth2 app covers both.
# 1. Create OAuth2 credentials at console.cloud.google.com -> APIs & Services -> Credentials
#    Enable: Google Calendar API, Gmail API
# 2. Download as google_credentials.json -> /etc/hermes/google_credentials.json
# 3. Run /cal auth and /mail auth [account] in Telegram to authenticate
calendar:
  credentials_file: "/etc/hermes/google_credentials.json"
  timezone: "Europe/Belgrade"   # your home timezone
  accounts:
    - name: "velocity"
      token_file: "/home/hermes/.hermes/google_token_velocity.json"

# Gmail -- multi-account email reading and replying
# Same credentials file as Calendar (enable Gmail API in the same project).
# Auth via /mail auth [account] in Telegram or HUD.
# priority: high = shown first, reply fast; medium = business; low = personal/spam
gmail:
  credentials_file: "/etc/hermes/google_credentials.json"
  accounts:
    - name: "paywise"
      email: "nikola@pay-wise.io"
      token_file: "/home/hermes/.hermes/gmail_token_paywise.json"
      priority: "high"
    - name: "velocity"
      email: "velocity72h@gmail.com"
      token_file: "/home/hermes/.hermes/gmail_token_velocity.json"
      priority: "medium"
    - name: "personal"
      email: "nikolazivkovic0803@gmail.com"
      token_file: "/home/hermes/.hermes/gmail_token_personal.json"
      priority: "low"

anthropic:
  api_key: "sk-ant-..."
  model: "claude-sonnet-4-5"
  spend_cap_usd: 20.0           # hard monthly limit -- Claude calls stop if exceeded

deepseek:
  api_key: "sk-..."
  model: "deepseek-chat"        # DeepSeek V3

gemini:
  api_key: "..."
  model: "gemini-2.0-flash"     # free tier: 15 req/min, 1M tok/day

# Groq -- ultra-fast free inference on open-source models.
# Get a free key at console.groq.com.
# Recommended models:
#   llama-3.1-8b-instant          -- fastest, free, used for simple quick replies
#   llama-3.3-70b-versatile       -- best quality on Groq free tier
#   nous-hermes-2-pro-llama-3-1-8b -- NousResearch Hermes (check Groq dashboard for availability)
#
# To use NousResearch Hermes via Together AI instead:
#   base_url: "https://api.together.xyz/v1/chat/completions"
#   model: "NousResearch/Hermes-3-Llama-3.1-70B-Turbo"
groq:
  api_key: "gsk_..."
  model: "llama-3.1-8b-instant"

router:
  default_provider: "deepseek"
  complex_provider: "claude"
  free_fallback: "gemini"
  short_message_max_tokens: 150  # messages under this -> deepseek
  history_limit: 10              # past exchanges replayed as conversation memory
  claude_trigger_prefixes:
    - "/code"
    - "/analyze"
    - "/plan"
    - "/think"
    - "/research"

# Long-term "facts brain" (Supermemory). Conversation history works without this;
# this layer remembers facts about you ACROSS sessions and injects only the
# relevant ones per message. Leave enabled:false until you have an API key.
# Get a free key at console.supermemory.ai, then set enabled:true.
memory:
  enabled: false
  provider: "supermemory"
  api_key: ""                    # sm_... from console.supermemory.ai
  base_url: "https://api.supermemory.ai"
  add_path: "/v3/documents"      # override only if the API path changes
  search_path: "/v4/search"
  search_limit: 5                # how many facts to retrieve per message
  timeout_seconds: 6.0           # memory never blocks a reply longer than this
  namespace: "hermes"            # tag used to scope memories to this agent

# Codex -- OpenAI's coding agent as ZERO's "web-dev hands". Uses your ChatGPT
# sign-in on this server (run `codex` once to log in), NOT the paid API. ZERO
# delegates coding/design jobs to it via the code_task tool.
codex:
  enabled: false                 # set true after `codex` is signed in on the box
  binary: "codex"                # or an absolute path to the codex binary
  default_repo: "/opt/jarvis"
  allowed_repos:                 # Codex may only run inside these paths
    - "/opt/jarvis"
    - "/var/www/peptide-command-center"
  extra_args: []                 # e.g. ["--full-auto"] if Codex won't write in your version
  timeout_seconds: 900

# Claude Code -- a second coding hand next to Codex. Runs `claude -p` in a repo.
# Supports multiple Claude logins: give each account its own CLAUDE_CONFIG_DIR
# (sign in once per dir), then ZERO picks one with the `account` argument.
claude_code:
  enabled: false
  binary: "claude"
  default_repo: "/opt/jarvis"
  allowed_repos:
    - "/opt/jarvis"
    - "/var/www/peptide-command-center"
  accounts:
    - name: "main"
      config_dir: "/root/.claude-main"      # CLAUDE_CONFIG_DIR for account 1
    - name: "second"
      config_dir: "/root/.claude-second"    # CLAUDE_CONFIG_DIR for account 2
  extra_args: ["--permission-mode", "acceptEdits"]
  timeout_seconds: 900

# GitHub -- powers the HUD PROJECTS panel and ZERO's repo tools (read-only use).
# token: a personal access token (classic, 'repo' scope). Keep it out of git.
github:
  token: ""                      # ghp_... personal access token
  username: ""                   # optional; the token's own user by default
  repos: []                      # optional allowlist e.g. ["me/site", "me/crm"]; empty = all the token sees
  max_shown: 8                   # repos shown in the PROJECTS panel

database:
  path: "/home/hermes/.hermes/hermes.db"

dashboard:
  host: "127.0.0.1"             # localhost only -- use SSH tunnel to access
  port: 8080
  secret_key: "CHANGE_THIS_RANDOM_STRING"

server:
  timezone: "Europe/London"
  log_level: "INFO"
