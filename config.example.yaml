telegram:
  bot_token: "YOUR_BOT_TOKEN_FROM_BOTFATHER"
  owner_user_id: 123456789      # your numeric Telegram ID (get from @userinfobot)

# Remove the entire block for any platform you don't want
whatsapp:
  access_token: "YOUR_META_ACCESS_TOKEN"
  phone_number_id: "YOUR_PHONE_NUMBER_ID"
  verify_token: "YOUR_CUSTOM_VERIFY_TOKEN"  # any string you choose
  app_secret: "YOUR_APP_SECRET"             # optional, for signature verification

discord:
  bot_token: "YOUR_DISCORD_BOT_TOKEN"
  owner_id: 123456789           # your Discord user ID (optional)

slack:
  bot_token: "xoxb-..."
  signing_secret: "YOUR_SLACK_SIGNING_SECRET"

# Google Calendar (supports multiple accounts)
# 1. Create OAuth2 credentials at console.cloud.google.com -> APIs & Services -> Credentials
# 2. Download as google_credentials.json and place at the path below
# 3. Run /cal auth in Telegram to authenticate each account
calendar:
  credentials_file: "/etc/hermes/google_credentials.json"
  timezone: "Europe/Belgrade"   # your home timezone
  accounts:
    - name: "primary"
      token_file: "/home/hermes/.hermes/google_token_primary.json"
    # Add more accounts:
    # - name: "work"
    #   token_file: "/home/hermes/.hermes/google_token_work.json"

anthropic:
  api_key: "sk-ant-..."
  model: "claude-sonnet-4-5"
  spend_cap_usd: 20.0           # hard monthly limit -- Claude calls stop if exceeded

deepseek:
  api_key: "sk-..."
  model: "deepseek-chat"        # DeepSeek V3

gemini:
  api_key: "..."
  model: "gemini-2.0-flash"     # free tier: 15 req/min, 1M tok/day

router:
  default_provider: "deepseek"
  complex_provider: "claude"
  free_fallback: "gemini"
  short_message_max_tokens: 150  # messages under this -> deepseek
  claude_trigger_prefixes:
    - "/code"
    - "/analyze"
    - "/plan"
    - "/think"
    - "/research"

database:
  path: "/home/hermes/.hermes/hermes.db"

dashboard:
  host: "127.0.0.1"             # localhost only -- use SSH tunnel to access
  port: 8080
  secret_key: "CHANGE_THIS_RANDOM_STRING"

server:
  timezone: "Europe/London"
  log_level: "INFO"
