telegram:
  bot_token: "YOUR_BOT_TOKEN_FROM_BOTFATHER"
  owner_user_id: 123456789      # your numeric Telegram ID (get from @userinfobot)

# Remove the entire block for any platform you don't want
whatsapp:
  access_token: "YOUR_META_ACCESS_TOKEN"
  phone_number_id: "YOUR_PHONE_NUMBER_ID"
  verify_token: "YOUR_CUSTOM_VERIFY_TOKEN"  # any string you choose
  app_secret: "YOUR_APP_SECRET"             # optional, for signature verification

discord:
  bot_token: "YOUR_DISCORD_BOT_TOKEN"
  owner_id: 123456789           # your Discord user ID (optional)

slack:
  bot_token: "xoxb-..."
  signing_secret: "YOUR_SLACK_SIGNING_SECRET"

# Google Calendar (supports multiple accounts)
# Same credentials file as Gmail -- one OAuth2 app covers both.
# 1. Create OAuth2 credentials at console.cloud.google.com -> APIs & Services -> Credentials
#    Enable: Google Calendar API, Gmail API
# 2. Download as google_credentials.json -> /etc/hermes/google_credentials.json
# 3. Run /cal auth and /mail auth [account] in Telegram to authenticate
calendar:
  credentials_file: "/etc/hermes/google_credentials.json"
  timezone: "Europe/Belgrade"   # your home timezone
  accounts:
    - name: "velocity"
      token_file: "/home/hermes/.hermes/google_token_velocity.json"

# Gmail -- multi-account email reading and replying
# Same credentials file as Calendar (enable Gmail API in the same project).
# Auth via /mail auth [account] in Telegram or HUD.
# priority: high = shown first, reply fast; medium = business; low = personal/spam
gmail:
  credentials_file: "/etc/hermes/google_credentials.json"
  accounts:
    - name: "paywise"
      email: "nikola@pay-wise.io"
      token_file: "/home/hermes/.hermes/gmail_token_paywise.json"
      priority: "high"
    - name: "velocity"
      email: "velocity72h@gmail.com"
      token_file: "/home/hermes/.hermes/gmail_token_velocity.json"
      priority: "medium"
    - name: "personal"
      email: "nikolazivkovic0803@gmail.com"
      token_file: "/home/hermes/.hermes/gmail_token_personal.json"
      priority: "low"

anthropic:
  api_key: "sk-ant-..."
  model: "claude-sonnet-4-5"
  spend_cap_usd: 20.0           # hard monthly limit -- Claude calls stop if exceeded

deepseek:
  api_key: "sk-..."
  model: "deepseek-chat"        # DeepSeek V3

gemini:
  api_key: "..."
  model: "gemini-2.0-flash"     # free tier: 15 req/min, 1M tok/day

# Groq -- ultra-fast free inference on open-source models.
# Get a free key at console.groq.com.
# Recommended models:
#   llama-3.1-8b-instant          -- fastest, free, used for simple quick replies
#   llama-3.3-70b-versatile       -- best quality on Groq free tier
#   nous-hermes-2-pro-llama-3-1-8b -- NousResearch Hermes (check Groq dashboard for availability)
#
# To use NousResearch Hermes via Together AI instead:
#   base_url: "https://api.together.xyz/v1/chat/completions"
#   model: "NousResearch/Hermes-3-Llama-3.1-70B-Turbo"
groq:
  api_key: "gsk_..."
  model: "llama-3.1-8b-instant"

router:
  default_provider: "deepseek"
  complex_provider: "claude"
  free_fallback: "gemini"
  short_message_max_tokens: 150  # messages under this -> deepseek
  claude_trigger_prefixes:
    - "/code"
    - "/analyze"
    - "/plan"
    - "/think"
    - "/research"

database:
  path: "/home/hermes/.hermes/hermes.db"

dashboard:
  host: "127.0.0.1"             # localhost only -- use SSH tunnel to access
  port: 8080
  secret_key: "CHANGE_THIS_RANDOM_STRING"

server:
  timezone: "Europe/London"
  log_level: "INFO"
